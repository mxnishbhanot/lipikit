# Packaging metadata. The two name fields below are the only branding strings
# outside packages/shared/src/config/branding.ts — a YAML config cannot import
# TypeScript — so keep them equal to BRANDING.appName / BRANDING.tagline.
# appId is deliberately NOT renamed with the product: it keys the Windows
# AppUserModelID and the installer's registry entry, and changing it orphans
# every installed copy.
appId: com.aianywhere.app
productName: AI Anywhere (Temporary)
# Without this the binary is named after the scoped package —
# "@ai-anywheredesktop" — which also breaks the StartupWMClass match below.
executableName: ai-anywhere
copyright: Copyright © 2026 the authors
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  # The tray reads these at runtime, so they have to be inside the app bundle
  # and not only in buildResources, which the packager consumes and drops.
  - build/icon.ico
  - build/icons/32x32.png
# better-sqlite3 ships a .node binary; dlopen cannot read it from inside asar.
# The pattern is anchored, not '**/node_modules/...': a leading '**' makes the
# packager walk the workspace symlinks it was just told to skip.
asarUnpack:
  - node_modules/better-sqlite3/**
npmRebuild: true
win:
  # Shipped rather than derived from icon.png so the build needs no network
  # round trip to electron-builder's icon conversion service.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: AI-Anywhere-${version}-win-${arch}.${ext}
nsis:
  # A one-click installer would give the user no say over the install location
  # and no uninstaller entry worth the name.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Uninstalling leaves ~/.config data alone; settings and history are the
  # user's, not the installer's, and a reinstall should find them again.
  deleteAppDataOnUninstall: false
portable:
  artifactName: AI-Anywhere-${version}-win-${arch}-portable.${ext}
linux:
  icon: build/icons
  category: Utility
  synopsis: AI writing assistant available anywhere via a global hotkey
  # Required for the .deb control file; a deb without it will not build.
  maintainer: mxnish-bhanot <mxnish-bhanot@users.noreply.github.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # Flat name=value map. electron-builder 25 has no `desktop.entry` sub-key:
  # nesting one writes a literal `entry=[object Object]` line and drops these,
  # leaving StartupWMClass defaulted to the product name.
  desktop:
    StartupWMClass: ai-anywhere
    Keywords: AI;writing;rewrite;assistant;
  artifactName: AI-Anywhere-${version}-linux-${arch}.${ext}
deb:
  # xdotool is the X11 active-window/keystroke path: recommended, not required,
  # because the app starts and explains a degraded session rather than refusing
  # to run. libsecret-1-0 is not listed here — electron-builder detects the
  # linked .so and puts it in Depends already.
  recommends:
    - xdotool
    # The tray needs a StatusNotifierItem host. Ubuntu's GNOME session has one
    # only via this library plus the AppIndicator extension, and the app runs
    # fine without a tray, so this is recommended and not a hard dependency.
    - libayatana-appindicator3-1
# Artifacts are uploaded by the release workflow with `gh release`, so
# electron-builder needs no publishing credentials of its own.
publish: null
