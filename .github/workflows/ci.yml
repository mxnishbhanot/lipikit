name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # libsecret is a build dependency of the keytar-free keyring path and of
      # better-sqlite3's rebuild; xvfb is what lets Electron open a window on a
      # headless runner.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsecret-1-dev xvfb

      - run: pnpm install --frozen-lockfile

      # Packages compile to dist/ first: typecheck walks the project graph, and
      # both the database suite and the Electron app load the built output.
      - run: pnpm build

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:db

      - name: Playwright Electron tests
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  package:
    name: Package (${{ matrix.os }})
    # Packaging is slow and only worth proving once the checks pass.
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsecret-1-dev

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Build installers
        run: pnpm --filter @ai-anywhere/desktop dist

      # Not attached to a release — this only proves the installers still
      # build on both platforms. The release workflow is what publishes.
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          retention-days: 7
          if-no-files-found: error
